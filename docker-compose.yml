services:
  avdb:
    image: leolitaly/avdb:latest
    container_name: avdb
    restart: unless-stopped
    ports:
      # 端口映射，保持默认即可
      - 8000:8000
    volumes:
      # 数据目录映射，保持默认即可
      - ./data:/data
      # 用于 MDC-NG 映射表覆盖后的容器重启。
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # 默认：SQLite（开箱即用）
      - DATABASE_URL=${DATABASE_URL:-sqlite:////data/avdb.db}
      # PostgreSQL 示例（如需切换，取消注释并填写）
      # - DATABASE_URL=postgresql://avdb:change_me@postgres:5432/avdb
      # - POSTGRES_HOST=postgres
      # - POSTGRES_PORT=5432
      # - POSTGRES_USER=avdb
      # - POSTGRES_PASSWORD=change_me
      # - POSTGRES_DB=avdb
      # 以系统为准，下面是绿联的pgid和puid
      - PGID=${PGID:-10}
      - PUID=${PUID:-1000}
      # 时区，中国改成 Asia/Shanghai
      - TZ=${TZ:-Europe/Rome}
    mem_limit: 4G
    networks:
      - avdb_net

  postgres:
    image: postgres:16
    container_name: avdb-postgres
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-avdb}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-change_me}
      - POSTGRES_DB=${POSTGRES_DB:-avdb}
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    networks:
      - avdb_net

networks:
  avdb_net:
    driver: bridge
