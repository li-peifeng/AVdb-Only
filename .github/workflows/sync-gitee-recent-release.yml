name: Sync AVdb-CSV 30D Release to Gitee

on:
  workflow_call:
    inputs:
      tag:
        description: GitHub Release tag to sync
        required: true
        type: string
    secrets:
      GITEE_TOKEN:
        required: true
      GITEE_REPOSITORY_URL:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub Release tag to sync again
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sync-avdb-csv-30d-gitee
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      GITEE_REPOSITORY_URL: ${{ secrets.GITEE_REPOSITORY_URL }}

    steps:
      - name: Resolve release tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag || '' }}
        run: |
          set -Eeuo pipefail
          tag="${INPUT_TAG:-}"
          [[ "$tag" =~ ^[A-Za-z0-9._/-]+$ ]] || {
            echo "Invalid release tag: $tag" >&2
            exit 1
          }
          echo "AVDB_CSV_RELEASE_TAG=$tag" >> "$GITHUB_ENV"

      - name: Validate Gitee token
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ -n "${GITEE_TOKEN:-}" ]] || {
            echo 'Repository secret GITEE_TOKEN is required.' >&2
            exit 1
          }
          [[ -n "${GITEE_REPOSITORY_URL:-}" ]] || {
            echo 'Repository secret GITEE_REPOSITORY_URL is required.' >&2
            exit 1
          }

      - name: Resolve Gitee repository
        shell: bash
        run: |
          set -Eeuo pipefail
          repository_url="${GITEE_REPOSITORY_URL%/}"
          repository_url="${repository_url%.git}"
          if [[ "${repository_url}" =~ ^(https://[^/]+)/([^/]+)/([^/?#]+)$ ]]; then
            {
              echo "AVDB_GITEE_BASE_URL=${BASH_REMATCH[1]}"
              echo "AVDB_GITEE_OWNER=${BASH_REMATCH[2]}"
              echo "AVDB_GITEE_REPO=${BASH_REMATCH[3]}"
            } >> "$GITHUB_ENV"
          else
            echo 'GITEE_REPOSITORY_URL must be an HTTPS repository URL.' >&2
            exit 1
          fi

      - name: Download and validate GitHub 30D assets
        id: assets
        shell: bash
        run: |
          set -Eeuo pipefail
          asset_dir="$RUNNER_TEMP/avdb-csv-30d-assets"
          mkdir -p "$asset_dir"
          gh release download "$AVDB_CSV_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern '30D_*.zip' \
            --dir "$asset_dir"

          shopt -s nullglob
          paths=("$asset_dir"/30D_*.zip)
          if [[ "${#paths[@]}" -ne 3 ]]; then
            echo "Expected exactly three 30D zip assets, found ${#paths[@]}" >&2
            find "$asset_dir" -maxdepth 1 -type f -printf '%f\n' >&2
            exit 1
          fi

          declare -A websites=()
          for path in "${paths[@]}"; do
            name="$(basename "$path")"
            if [[ ! "$name" =~ ^30D_(sehuatang|X1080X|LTX)_[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9]{2}-[0-9]{2}-[0-9]{2}\.zip$ ]]; then
              echo "Unexpected 30D asset name: $name" >&2
              exit 1
            fi
            website="${BASH_REMATCH[1]}"
            if [[ -n "${websites[$website]:-}" ]]; then
              echo "Duplicate 30D asset for website: $website" >&2
              exit 1
            fi
            websites[$website]=1
          done
          [[ "${#websites[@]}" -eq 3 ]] || {
            echo "The 30D release must contain sehuatang, X1080X and LTX assets." >&2
            exit 1
          }

          mapfile -t sorted_names < <(basename -a "${paths[@]}" | sort)
          name_1="${sorted_names[0]}"
          name_2="${sorted_names[1]}"
          name_3="${sorted_names[2]}"
          names_fingerprint="$({ sha256sum "${paths[@]}"; } | sort | sha256sum | awk '{print $1}')"

          {
            echo "AVDB_CSV_ASSET_DIR=$asset_dir"
            echo "AVDB_CSV_NAME_1=$name_1"
            echo "AVDB_CSV_NAME_2=$name_2"
            echo "AVDB_CSV_NAME_3=$name_3"
            echo "AVDB_CSV_NAMES_FINGERPRINT=$names_fingerprint"
          } >> "$GITHUB_ENV"

          {
            echo "name_1=$name_1"
            echo "name_2=$name_2"
            echo "name_3=$name_3"
            echo "names_fingerprint=$names_fingerprint"
          } >> "$GITHUB_OUTPUT"

      - name: Create or update the Gitee release
        shell: bash
        run: |
          set -Eeuo pipefail
          api_root="$AVDB_GITEE_BASE_URL/api/v5/repos/$AVDB_GITEE_OWNER/$AVDB_GITEE_REPO"
          encoded_tag="$(python3 -c 'from urllib.parse import quote; import sys; print(quote(sys.argv[1], safe=""))' "$AVDB_CSV_RELEASE_TAG")"
          release_json="$RUNNER_TEMP/gitee-release.json"
          release_status="$(curl -sS --retry 3 --retry-delay 1 \
            -H "Authorization: Bearer $GITEE_TOKEN" \
            -H 'Accept: application/json' \
            -o "$release_json" -w '%{http_code}' \
            "$api_root/releases/tags/$encoded_tag" || true)"

          release_missing=0
          if [[ "$release_status" == '404' ]]; then
            release_missing=1
          elif [[ "$release_status" == '200' ]] \
            && jq -e 'type == "null"' "$release_json" >/dev/null; then
            release_missing=1
          fi

          if [[ "$release_missing" == '1' ]]; then
            body_file="$RUNNER_TEMP/gitee-release-payload.json"
            python3 - "$body_file" "$AVDB_CSV_RELEASE_TAG" "$AVDB_CSV_NAME_1" "$AVDB_CSV_NAME_2" "$AVDB_CSV_NAME_3" "$AVDB_CSV_NAMES_FINGERPRINT" <<'PY'
          import json
          import sys
          from pathlib import Path

          payload_path = Path(sys.argv[1])
          tag = sys.argv[2]
          name_1 = sys.argv[3]
          name_2 = sys.argv[4]
          name_3 = sys.argv[5]
          fingerprint = sys.argv[6]
          body = (
              'AVdb 资源库 30 天增量更新文件镜像。\n\n'
              '本 Release 只同步30天增量文件；全量文件仍只发布在 GitHub。\n\n'
              f'文件 SHA-256 指纹：`{fingerprint}`\n\n'
              '同步文件：\n'
              f'- `{name_1}`\n'
              f'- `{name_2}`\n'
              f'- `{name_3}`\n'
          )
          payload_path.write_text(
              json.dumps(
                  {
                      'tag_name': tag,
                      'name': f'AVdb-CSV 30D {tag}',
                      'target_commitish': 'master',
                      'body': body,
                      'prerelease': False,
                  },
                  ensure_ascii=False,
              ),
              encoding='utf-8',
          )
          PY
            curl --fail-with-body --retry 3 --retry-delay 1 \
              -H "Authorization: Bearer $GITEE_TOKEN" \
              -H 'Accept: application/json' \
              -H 'Content-Type: application/json' \
              -X POST "$api_root/releases" \
              --data-binary "@$body_file" > "$release_json"
          elif [[ "$release_status" != '200' ]]; then
            echo "Unable to read Gitee release for tag $AVDB_CSV_RELEASE_TAG (HTTP $release_status)." >&2
            cat "$release_json" >&2
            exit 1
          fi

          release_id="$(jq -er '.id | numbers' "$release_json")"
          echo "AVDB_GITEE_RELEASE_ID=$release_id" >> "$GITHUB_ENV"

      - name: Replace Gitee release assets with 30D files only
        shell: bash
        run: |
          set -Eeuo pipefail
          api_root="$AVDB_GITEE_BASE_URL/api/v5/repos/$AVDB_GITEE_OWNER/$AVDB_GITEE_REPO"
          assets_json="$RUNNER_TEMP/gitee-assets.json"
          status="$(curl -sS --retry 3 --retry-delay 1 \
            -H "Authorization: Bearer $GITEE_TOKEN" \
            -H 'Accept: application/json' \
            -o "$assets_json" -w '%{http_code}' \
            "$api_root/releases/$AVDB_GITEE_RELEASE_ID/attach_files" || true)"
          [[ "$status" == '200' ]] || {
            echo "Unable to list Gitee release assets (HTTP $status)." >&2
            cat "$assets_json" >&2
            exit 1
          }

          # Replacing every attachment prevents an old All_ file from
          # remaining on a Release that is being retried or reused.
          jq -r '.[] | .id // empty' "$assets_json" | while IFS= read -r asset_id; do
            [[ "$asset_id" =~ ^[0-9]+$ ]] || continue
            curl --fail-with-body --retry 3 --retry-delay 1 \
              -H "Authorization: Bearer $GITEE_TOKEN" \
              -X DELETE \
              "$api_root/releases/$AVDB_GITEE_RELEASE_ID/attach_files/$asset_id"
          done

          for asset_name in "$AVDB_CSV_NAME_1" "$AVDB_CSV_NAME_2" "$AVDB_CSV_NAME_3"; do
            curl --fail-with-body --retry 3 --retry-delay 1 \
              -H "Authorization: Bearer $GITEE_TOKEN" \
              -F "file=@$AVDB_CSV_ASSET_DIR/$asset_name;filename=$asset_name" \
              "$api_root/releases/$AVDB_GITEE_RELEASE_ID/attach_files"
          done

      - name: Verify Gitee release contains only 30D assets
        shell: bash
        run: |
          set -Eeuo pipefail
          api_root="$AVDB_GITEE_BASE_URL/api/v5/repos/$AVDB_GITEE_OWNER/$AVDB_GITEE_REPO"
          assets_json="$RUNNER_TEMP/gitee-assets-final.json"
          curl --fail-with-body --retry 3 --retry-delay 1 \
            -H "Authorization: Bearer $GITEE_TOKEN" \
            -H 'Accept: application/json' \
            "$api_root/releases/$AVDB_GITEE_RELEASE_ID/attach_files" > "$assets_json"

          jq -e --arg name_1 "$AVDB_CSV_NAME_1" --arg name_2 "$AVDB_CSV_NAME_2" --arg name_3 "$AVDB_CSV_NAME_3" \
            '([.[] | .name] | sort) == ([$name_1, $name_2, $name_3] | sort)' \
            "$assets_json" >/dev/null || {
            echo 'Gitee release assets do not exactly match the three 30D files.' >&2
            jq -r '.[].name' "$assets_json" >&2
            exit 1
          }
          echo "Gitee 30D release synced: $AVDB_CSV_RELEASE_TAG"

      - name: Summary
        shell: bash
        run: |
          {
            echo "## AVdb-CSV 30D Gitee sync"
            echo
            echo "- GitHub release: $AVDB_CSV_RELEASE_TAG"
            echo "- Assets: $AVDB_CSV_NAME_1, $AVDB_CSV_NAME_2, $AVDB_CSV_NAME_3"
            echo "- SHA-256 fingerprint: $AVDB_CSV_NAMES_FINGERPRINT"
            echo "- Full All_ assets: not synchronized"
          } >> "$GITHUB_STEP_SUMMARY"
